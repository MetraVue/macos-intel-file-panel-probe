name: Native file panel probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  panels:
    runs-on: macos-26-intel
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Probe file panels before and after disabling the icon agent
        run: python3 run.py
